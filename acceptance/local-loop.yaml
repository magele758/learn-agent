# 从 docs/FEATURES.md 的 P0（F1–F9）和 src/cli/check.ts 已有断言提炼。状态保持 draft，等你确认后再标 approved。
id: local-loop
title: 本地命题可以按依赖测量、计划、教学并练习
status: draft
source: docs/FEATURES.md
requirement: |
  在没有网络存储的前提下，把一条命题和它的前置放进本地图谱，完成一次测量、计划和练习后，能从 data/graph.json 看出谁先学、谁还没学。
non_goals:
  - 不把命题状态折成一个掌握分数
  - 不在本仓库再写一套模型循环
  - 间隔复习、笔记检索、图形界面不在这份验收里（FEATURES 标为 P1）
notes: |
  待确认：阅读器划线提问（src/reading/ask.ts）要不要算进第一版验收。现有 npm test 不覆盖它。
criteria:
  - id: AC-1
    given: 本地演示图谱里有 prior，以及依赖它的 claim
    when: 测量 prior，计划下一步，再对计划到的命题做一次通过的练习
    then: prior 的状态是 stable，claim 仍是 unknown，依赖边有一条，并留下推理和练习记录
    verify: auto
    verified: src/cli/check.ts
  - id: AC-2
    given: 图谱里没有要练习的命题
    when: 对这个 id 调用练习
    then: 抛出 missing proposition，不写入练习记录
    verify: auto
    verified: src/session/runner.ts
