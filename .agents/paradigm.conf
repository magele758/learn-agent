# 范式脚本的项目配置（自有层，paradigm 不会覆盖）。格式 key=value；环境变量 AEP_<KEY 大写> 优先。
# agent 隔离端口：scripts/dev-ports.sh 在该区间内按分支确定性分配一段 dev_ports_block 个端口
dev_ports_range=20000-29999
dev_ports_block=10
# 仓库卫生：单文件大小上限（KB），环境变量 AEP_MAX_FILE_KB 优先
max_file_kb=5120
# 提交标题长度上限（字符），环境变量 AEP_MAX_SUBJECT 优先
max_subject_chars=100
# AGENTS.md 行数预算
agents_max_lines=80
# eval runner（约定见 evals/README.md）：每个数据集调用一次「<命令> <数据集>」，stdout 输出标准 JSON；留空 = gate full 跳过 eval
# 例：eval_runner=scripts/eval-run.sh --cmd 'node bin/answer.js'
eval_runner=
# 基线对比阈值（scripts/eval-compare.sh），off = 不检查该项
# 通过率比基线最多低多少（0–1 的绝对差），超出即失败
eval_max_pass_rate_drop=0.05
# 总成本 / 延迟 p95 比基线最多高多少（比例；p95 增量不足 50 ms 视为噪声）
eval_max_cost_increase=0.2
eval_max_p95_increase=0.5
# 绝对上限：单个数据集一次运行的总成本（与结果同单位）、延迟 p95（毫秒）；留空 = 不限
eval_max_cost=
eval_max_p95_ms=
# 成本 / 延迟超出时：fail = 失败，warn = 只告警
eval_on_budget=fail
# prompt 目录（空格分隔）：相对 base 改动后 gate merge 要求版本标记正确、eval 对比通过
prompt_dirs=prompts
